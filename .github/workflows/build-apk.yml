name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Coffer APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Prayer Wakeup APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prayerwakeup-debug-apk
          path: prayerwakeup/build/outputs/apk/debug/prayerwakeup-debug.apk

      - name: Publish APKs to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: Debug APKs (latest)
          body: |
            Automatically built debug APKs from `${{ github.ref_name }}` (commit ${{ github.sha }}).
            For testing only — not signed for release.
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            prayerwakeup/build/outputs/apk/debug/prayerwakeup-debug.apk
